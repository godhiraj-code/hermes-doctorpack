name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        pyyaml: ['PyYAML>=6.0,<7']
        include:
          - python-version: '3.10'
            pyyaml: 'PyYAML==6.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "${{ matrix.pyyaml }}" pytest build "setuptools>=68" wheel ruff
      - name: Lint
        run: python -m ruff check --isolated --select E4,E7,E9,F __init__.py hermes_doctorpack tests
      - name: Run tests
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q
